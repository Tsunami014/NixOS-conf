# BACKGROUND
background {
    monitor =
    #path = ~/.config/hypr/hyprlock.png
    color = rgb(65, 72, 104)
    blur_passes = 1
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
}

# INPUT FIELD
input-field {
    monitor =
    size = 400, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(26, 27. 38)
    inner_color = rgba(169, 177, 214, 0.5)
    font_color = rgb(207, 201, 194)
    fade_on_empty = false
    font_family = JetBrains Mono
    placeholder_text = <i><span foreground="##a9b1d699">Hi, $USER!</span></i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

# Hour-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H")"
    color = rgba(224, 175, 104, .6)
    font_size = 180
    font_family = steelfish outline regular 
    position = 0, 350
    halign = center
    valign = center
}

# Minute-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = rgba(192, 202, 245, .6)
    font_size = 180
    font_family = steelfish outline regular
    position = 0, 125
    halign = center
    valign = center
}

# Day-Date-Month
label {
    monitor =
    text = cmd[update:1000] echo "<span color='##c0caf599'>$(date '+%A, ')</span><span color='##e0af6899'>$(date '+%d %B')</span>"
    font_size = 30
    font_family = JetBrains Mono Extrabold
    position = 0, -230
    halign = center
    valign = center
}


# Battery
label {
    monitor =
    text = cmd[update:10000] echo "<b> Battery: "$(cat /sys/class/power_supply/BAT*/capacity | awk '{sum+=$1; count++} END {print sum/count}')"% </b>" 
    color = rgba(180, 249, 248, 0.7)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, -280
    halign = center
    valign = center
}
