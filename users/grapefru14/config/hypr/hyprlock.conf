# BACKGROUND
background {
    monitor =
    path = ~/Pictures/currentBg.jpg
    color = rgb(65, 72, 104)
    blur_passes = 3
    blur_size = 3
    contrast = 0.8
    brightness = 0.7
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    hide_cursor = true
}

# INPUT FIELD
input-field {
    monitor =
    size = 25%, 60
    outline_thickness = 4
    dots_size = 0.3 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(169, 177, 214)
    inner_color = rgba(129, 139, 179, 0.6)
    font_color = rgb(207, 201, 194)
    fade_on_empty = false
    font_family = DejaVu Sans
    placeholder_text = <i><span foreground="##a9b1d699">Hi, $USER!</span></i>
    hide_input = false
    position = 0, -12%
    halign = center
    valign = center
}

# Hour-Minute-Time
label {
    monitor =
    text = cmd[update:1000] echo "<span color='##e0af6899'>$(date +%-I)</span><span color='##cfc9c2'>:</span><span color='##c0caf599'>$(date +%M)</span><span color='##cfc9c2'> $(date +%p)</span>"
    font_size = 200
    font_family = steelfish outline regular
    position = 0, 23%
    halign = center
    valign = center
}

# Day-Date-Month
label {
    monitor =
    text = cmd[update:1000] echo "<span color='##c0caf599'>$(date '+%A, ')</span><span color='##b4f9f899'>$(date '+%d %B')</span>"
    font_size = 48
    font_family = DejaVu Sans
    position = 0, 6%
    halign = center
    valign = center
}


# Battery
label {
    monitor =
    text = cmd[update:10000] echo "<b>  "$(cat /sys/class/power_supply/BAT*/capacity | awk '{sum+=$1; count++} END {print sum/count}')"%</b>"
    color = rgba(224, 175, 104, 0.7)
    font_size = 24
    font_family = DejaVu Sans
    position = 0, -45%
    halign = center
    valign = center
}
