# Generated from this template by theme-gen.py; edit here, not in ~/.config/yazi
[mgr]
cwd = { fg = "{{fg}}", bold = true }

# Hovered
hovered = { bg = "{{bg3}}" }
preview_hovered = { underline = true }

# Find
find_keyword = { fg = "{{purple}}", reversed = true }
find_position = { fg = "{{muted1}}", bold = true, italic = true }

# Marker
marker_copied = { fg = "{{green}}", bg = "{{green}}" }
marker_cut = { fg = "{{red}}", bg = "{{red}}" }
marker_marked = { fg = "{{cyan}}", bg = "{{cyan}}" }
marker_selected = { fg = "{{yellow}}", bg = "{{yellow}}" }

# Count
count_copied = { fg = "{{green}}", bold = true, reversed = true }
count_cut = { fg = "{{red}}", bold = true, reversed = true }
count_selected = { fg = "{{cyan}}", bold = true, reversed = true }

# Border
border_symbol = "│"
border_style = { fg = "{{muted2}}" }

[tabs]
active = { fg = "{{primary}}", bg = "{{bg3}}", bold = true }
inactive = { fg = "{{muted1}}", bg = "{{bg2}}" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
# Normal mode
normal_main = { fg = "{{bg}}", bg = "{{yellow}}", bold = true }
normal_alt = { fg = "{{yellow}}", bg = "{{bg3}}" }

# Select mode
select_main = { fg = "{{bg}}", bg = "{{purple}}", bold = true }
select_alt = { fg = "{{purple}}", bg = "{{bg3}}" }

# Unset mode
unset_main = { fg = "{{bg}}", bg = "{{cyan}}", bold = true }
unset_alt = { fg = "{{cyan}}", bg = "{{bg3}}" }

[status]
overall = { fg = "{{fg}}" }

# Permissions
perm_type = { fg = "{{blue}}" }
perm_read = { fg = "{{yellow}}" }
perm_write = { fg = "{{red}}" }
perm_exec = { fg = "{{green}}" }
perm_sep = { fg = "{{muted1}}" }

# Progress
progress_label = { fg = "{{bg}}" }
progress_normal = { fg = "{{blue}}", bg = "{{br_blue}}" }
progress_error = { bg = "{{red}}" }

[which]
cols = 2
mask = { bg = "{{bg2}}" }
cand = { fg = "{{yellow}}", bold = true }
rest = { fg = "{{yellow}}", italic = true }
desc = { fg = "{{muted1}}" }
separator = " "
separator_style = {}

[confirm]
border = { fg = "{{bg3}}" }
title = { fg = "{{muted1}}", bold = true }
content = { fg = "{{fg}}", bold = true }
list = { fg = "{{fg}}" }
btn_yes = { fg = "{{fg}}", bg = "{{bg3}}", bold = true }
btn_no = { fg = "{{muted1}}", bg = "{{bg2}}" }

[spot]
border = { fg = "{{muted2}}" }
title = { fg = "{{muted1}}", bold = true }
tbl_col = { fg = "{{muted1}}" }
tbl_cell = { bg = "{{bg2}}" }

[notify]
# Notification title
title_info = { fg = "{{blue}}" }
title_warn = { fg = "{{orange}}" }
title_error = { fg = "{{red}}" }

[pick]
border = { fg = "{{muted2}}", bold = true }
active = { fg = "{{fg}}" }
inactive = { fg = "{{muted1}}" }

[input]
border = { fg = "{{muted2}}" }
title = { fg = "{{muted1}}", bold = true }
value = { fg = "{{fg}}" }
selected = { bg = "{{bg2}}" }

[cmp]
border = { fg = "{{muted2}}", bold = true }
active = { fg = "{{muted1}}", bg = "{{bg2}}" }
inactive = { fg = "{{muted1}}" }

[tasks]
border = { fg = "{{muted2}}" }
title = { fg = "{{muted1}}", bold = true }
hovered = { bg = "{{bg2}}" }

[help]
on = { fg = "{{blue}}" }
run = { fg = "{{cyan}}" }
desc = { fg = "{{muted1}}", italic = true }
hovered = { bg = "{{bg2}}" }
footer = { fg = "{{fg}}", bg = "{{bg2}}", bold = true }

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "{{purple}}" },

  # Media
  { mime = "video/*", fg = "{{yellow}}" },
  { mime = "audio/*", fg = "{{yellow}}" },

  # Executable
  { url = "*", is = "exec", fg = "{{green}}" },

  # Broken symbolic link
  { url = "*", is = "orphan", fg = "{{muted1}}", crossed = true },
  { url = "*/", is = "orphan", fg = "{{muted1}}", crossed = true },

  # Symbolic links
  { url = "*", is = "link", fg = "{{cyan}}" },
  { url = "*/", is = "link", fg = "{{cyan}}" },

  # Empty/hidden files
  { url = "*", is = "hidden", fg = "{{muted1}}" },
  { url = "*/", is = "hidden", fg = "{{muted1}}" },
  { mime = "inode/empty", fg = "{{muted1}}" },

  # Fallback
  { url = "*", fg = "{{fg}}" },
  { url = "*/", fg = "{{fg}}" },
]
