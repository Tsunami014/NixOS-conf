[[mgr.prepend_keymap]]
on  = [ "!", "!" ]
run = "shell --block -- bash"
desc = "Launch bash"

[[mgr.prepend_keymap]]
on  = [ "!", "g" ]
run = "shell --block -- lazygit"
desc = "Launch lazygit"

[[mgr.prepend_keymap]]
on = [ "`" ]
run = "shell --block -- nvim ."
desc = "Launch neovim here"

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[mgr.prepend_keymap]]
on  = [ "g", "s", "s" ]
run = "cd /etc/nixos"
desc = "Go /etc/nixos"

[[mgr.prepend_keymap]]
on  = [ "g", "s", "u" ]
run = "cd /etc/nixos/users/$USER"
desc = "Go /etc/nixos/users/$USER"

[[mgr.prepend_keymap]]
on  = [ "g", "d" ]
run = 'cd /tmp/"Download-$USER"'
desc = 'Go Temporary Downloads'

[[mgr.prepend_keymap]]
on  = [ "g", "D" ]
run = "cd $HOME/Documents"
desc = "Go ~/Documents"

[[mgr.prepend_keymap]]
on  = [ "g", "t" ]
run = "cd /tmp"
desc = "Go /tmp"

[[mgr.prepend_keymap]]
on = [ "g", "r" ]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "Go to git toplevel"

[[mgr.prepend_keymap]]
on = "Y"
run = "plugin copy-quote"
desc = "Copy hovered path with quotes"

[[mgr.prepend_keymap]]
on = [ '"' ]
run = "plugin bookmarks save"
desc = "Save current position as a bookmark"

[[mgr.prepend_keymap]]
on = [ "'" ]
run = "plugin bookmarks jump"
desc = "Jump to a bookmark"

[[mgr.prepend_keymap]]
on = [ "b", "d" ]
run = "plugin bookmarks delete"
desc = "Delete a bookmark"

[[mgr.prepend_keymap]]
on = [ "b", "D" ]
run = "plugin bookmarks delete_all"
desc = "Delete all bookmarks"
