[[mgr.prepend_keymap]]
on  = [ "!", "!" ]
run = "shell --block -- bash"
desc = "Launch bash"

[[mgr.prepend_keymap]]
on  = [ "!", "g" ]
run = "shell --block -- lazygit"
desc = "Launch lazygit"

[[mgr.prepend_keymap]]
on  = [ "!", "s" ]
run = 'shell -- imvd "$1"'
desc = "Slideshow this folder"

[[mgr.prepend_keymap]]
on = [ "`" ]
run = "shell --block -- nvim ."
desc = "Launch neovim here"

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[mgr.prepend_keymap]]
on  = [ "g", "d" ]
run = 'cd /tmp/"Download-$USER"'
desc = 'Go Temporary Downloads'

[[mgr.prepend_keymap]]
on  = [ "g", "t" ]
run = "cd /tmp"
desc = "Go /tmp"

[[mgr.prepend_keymap]]
on = [ "g", "r" ]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "Go to git toplevel"

[[mgr.prepend_keymap]]
on = [ "c", "y" ]
run = 'shell -- bash -i -c "echo \"${1@Q}\" | copy"'
desc = "Copy the file path with quotes"

[[mgr.prepend_keymap]]
on = [ "c", "C" ]
run = 'shell -- bash -i -c "cat \"$1\" | copy"'
desc = "Copy the file contents"

[[mgr.prepend_keymap]]
on = [ '"' ]
run = "plugin bookmarks save"
desc = "Save current position as a bookmark"

[[mgr.prepend_keymap]]
on = [ "'" ]
run = "plugin bookmarks jump"
desc = "Jump to a bookmark"

[[mgr.prepend_keymap]]
on = [ '"', "`" ]
run = "plugin bookmarks delete"
desc = "Delete a bookmark"
